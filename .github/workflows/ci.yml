name: CI

on:
  push:
    branches: [main, feat/landing-stickpay]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      - name: Build
        run: npm run build

  vercel:
    needs: lint-test-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Deploy note
        run: echo "Connect this repository to Vercel and set API_KEY, SECRET and NEXT_PUBLIC_APP_URL."
